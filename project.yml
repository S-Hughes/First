name: WMInspections
options:
  bundleIdPrefix: edu.wm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WMInspections:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WMInspections
        excludes:
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
          - "Resources/**"
          - "Assets.xcassets/**"
    resources:
      - path: WMInspections/Resources
      - path: WMInspections/Assets.xcassets
      - path: WMInspections/PrivacyInfo.xcprivacy
    info:
      path: WMInspections/Info.plist
      properties:
        CFBundleDisplayName: W&M Inspections
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "W&M Inspections uses the camera to attach photos to inspection records taken during campus walks."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.wm.mbwa-inspections
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
